<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube — Gọn</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#youtube-frame{display:block;width:100%;height:100%;border:0}
body.locked #youtube-frame{pointer-events:none}
</style>
</head>
<body>
<iframe id="youtube-frame" title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const id=params.get('v')||'';
  const list=params.get('list')||'';
  const frame=document.querySelector('#youtube-frame');
  if(!id&&!list){document.body.textContent='Thiếu mã video hoặc playlist.';return;}
  const src=new URL(id?'https://www.youtube.com/embed/'+encodeURIComponent(id):'https://www.youtube.com/embed/videoseries');
  for(const key of ['start','end','si','list','index'])if(params.get(key))src.searchParams.set(key,params.get(key));
  src.searchParams.set('autoplay','1');
  src.searchParams.set('controls','0');
  src.searchParams.set('playsinline','1');
  src.searchParams.set('rel','0');
  src.searchParams.set('enablejsapi','1');
  src.searchParams.set('origin',location.origin);
  src.searchParams.set('widget_referrer',location.href);

  function sendYoutube(func,args=[]){
    frame.contentWindow?.postMessage(JSON.stringify({event:'command',func,args}),'https://www.youtube.com');
  }
  function setLocked(value){
    const locked=Boolean(value);
    document.body.classList.toggle('locked',locked);
    window.parent.postMessage({type:'gon-player-state',locked},location.origin);
  }
  frame.addEventListener('load',()=>setTimeout(()=>sendYoutube('setVolume',[80]),350));
  frame.src=src.toString();
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.data?.type!=='gon-command')return;
    if(event.data.func==='setLocked'){setLocked(event.data.args?.[0]);return;}
    sendYoutube(event.data.func,event.data.args||[]);
  });
  window.addEventListener('keydown',event=>{
    if(event.altKey&&event.key.toLowerCase()==='l'){event.preventDefault();setLocked(!document.body.classList.contains('locked'));}
  });
})();
</script>
</body></html>
