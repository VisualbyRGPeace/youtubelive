<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube — Gọn</title>
<style>
html,body,#youtube-player{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#youtube-player iframe{display:block;width:100%;height:100%;border:0}
body.locked #youtube-player iframe{pointer-events:none}
</style>
</head>
<body>
<div id="youtube-player"></div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const videoId=params.get('v')||'';
  const playlistId=params.get('list')||'';
  if(!videoId&&!playlistId){document.body.textContent='Thiếu mã video hoặc playlist.';return;}
  let player=null,ready=false,locked=false;
  const queued=[];
  function sendState(extra={}){
    if(!player||!ready)return;
    let currentTime=0,duration=0,state=-1;
    try{
      currentTime=player.getCurrentTime()||0;
      duration=player.getDuration()||0;
      state=player.getPlayerState();
    }catch{}
    const message={type:'gon-player-state',locked,currentTime,duration,state,...extra};
    window.parent.postMessage(message,location.origin);
    try{window.parent.opener?.postMessage(message,location.origin);}catch{}
  }
  function applyCommand(func,args=[]){
    if(func==='setLocked'){
      locked=Boolean(args[0]);
      document.body.classList.toggle('locked',locked);
      sendState();
      return;
    }
    if(!ready){queued.push([func,args]);return;}
    if(func==='seekTo')player.seekTo(Number(args[0])||0,true);
    else if(func==='seekToPreview')player.seekTo(Number(args[0])||0,false);
    else if(func==='setVolume')player.setVolume(Math.max(0,Math.min(100,Number(args[0])||0)));
    else if(['playVideo','pauseVideo','stopVideo','nextVideo','previousVideo','mute','unMute'].includes(func)&&typeof player[func]==='function')player[func]();
    sendState();
  }
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.data?.type!=='gon-command')return;
    applyCommand(event.data.func,event.data.args||[]);
  });
  window.addEventListener('keydown',event=>{
    if(event.altKey&&event.key.toLowerCase()==='l'){event.preventDefault();applyCommand('setLocked',[!locked]);}
  });
  window.onYouTubeIframeAPIReady=function(){
    const playerVars={autoplay:1,controls:0,disablekb:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin,widget_referrer:location.href};
    for(const key of ['start','end','index'])if(params.has(key))playerVars[key]=Number(params.get(key))||0;
    if(playlistId){playerVars.listType='playlist';playerVars.list=playlistId;}
    const options={width:'100%',height:'100%',playerVars,events:{
      onReady(event){
        player=event.target;ready=true;
        player.setVolume(80);
        for(const [func,args] of queued.splice(0))applyCommand(func,args);
        player.playVideo();
        sendState({ready:true});
        setInterval(()=>sendState(),500);
      },
      onStateChange(event){sendState({ready:true});},
      onAutoplayBlocked(){sendState({ready:true,autoplayBlocked:true});},
      onError(event){sendState({ready:true,error:event.data});}
    }};
    if(videoId)options.videoId=videoId;
    player=new YT.Player('youtube-player',options);
  };
  const script=document.createElement('script');
  script.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(script);
})();
</script>
</body></html>
