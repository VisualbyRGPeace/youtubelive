<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.tiktok.com">
<title>Video — Gọn</title>
<style>
html,body,#youtube-player{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#youtube-player iframe{display:block;width:100%;height:100%;border:0}
body.locked #youtube-player iframe{pointer-events:none}
</style>
</head>
<body>
<div id="youtube-player"></div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const videoId=params.get('v')||'';
  const playlistId=params.get('list')||'';
  const platform=params.get('platform')||'youtube';
  if(platform==='tiktok-profile'){
    const username=(params.get('username')||'').replace(/[^A-Za-z0-9._]/g,'');
    if(!username){document.body.textContent='Thiếu tên hồ sơ TikTok.';return;}
    const host=document.querySelector('#youtube-player');
    document.body.style.overflow='auto';
    host.style.width='100%';host.style.height='100%';host.style.overflow='auto';
    const profile=document.createElement('blockquote');
    profile.className='tiktok-embed';
    profile.setAttribute('cite','https://www.tiktok.com/@'+username);
    profile.setAttribute('data-unique-id',username);
    profile.setAttribute('data-embed-type','creator');
    profile.style.cssText='max-width:720px;min-width:288px;margin:0 auto;';
    const section=document.createElement('section');
    const link=document.createElement('a');
    link.href='https://www.tiktok.com/@'+username+'?refer=creator_embed';
    link.target='_blank';link.rel='noopener';link.textContent='@'+username;
    section.appendChild(link);profile.appendChild(section);host.appendChild(profile);
    const script=document.createElement('script');
    script.async=true;script.src='https://www.tiktok.com/embed.js';document.body.appendChild(script);
    window.addEventListener('message',event=>{
      if(event.origin!==location.origin||event.data?.type!=='gon-command'||event.data.func!=='setLocked')return;
      document.body.classList.toggle('locked',Boolean(event.data.args?.[0]));
    });
    return;
  }
  if(platform==='tiktok'){
    if(!videoId){document.body.textContent='Thiếu mã video TikTok.';return;}
    const host=document.querySelector('#youtube-player');
    const frame=document.createElement('iframe');
    const sid=Math.random().toString(36).slice(2);
    let seq=0,locked=false,ready=false,currentTime=0,duration=0,state=-1;
    const queue=[];
    frame.title='TikTok video';
    frame.allow='autoplay; encrypted-media; fullscreen; picture-in-picture; web-share';
    frame.referrerPolicy='strict-origin-when-cross-origin';
    function report(extra={}){
      const message={type:'gon-player-state',sid,seq:++seq,platform:'tiktok',locked,currentTime,duration,state,...extra};
      window.parent.postMessage(message,location.origin);
      try{window.parent.opener?.postMessage(message,location.origin);}catch{}
    }
    function send(type,value){
      const data={type,'x-tiktok-player':true};
      if(value!==undefined)data.value=value;
      frame.contentWindow?.postMessage(data,'https://www.tiktok.com');
    }
    function command(func,args=[]){
      if(func==='setLocked'){
        locked=Boolean(args[0]);document.body.classList.toggle('locked',locked);report();return;
      }
      if(!ready){queue.push([func,args]);return;}
      if(func==='playVideo')send('play');
      else if(func==='pauseVideo'||func==='stopVideo')send('pause');
      else if(func==='seekTo'||func==='seekToPreview')send('seekTo',Number(args[0])||0);
      else if(func==='setVolume')send(Number(args[0])<=0?'mute':'unMute');
    }
    window.addEventListener('message',event=>{
      if(event.origin!==location.origin||event.data?.type!=='gon-command')return;
      command(event.data.func,event.data.args||[]);
    });
    window.addEventListener('message',event=>{
      if(event.source!==frame.contentWindow||event.origin!=='https://www.tiktok.com')return;
      let data=event.data;
      if(typeof data==='string'){try{data=JSON.parse(data);}catch{return;}}
      if(data?.['x-tiktok-player']!==true)return;
      const value=data.value;
      if(data.type==='onPlayerReady'){
        ready=true;
        for(const [func,args] of queue.splice(0))command(func,args);
        send('play');report({ready:true});
      }else if(data.type==='onStateChange'){
        state=Number(value);report({ready:true});
      }else if(data.type==='onCurrentTime'){
        const time=typeof value==='object'&&value!==null?value:{currentTime:data.currentTime,duration:data.duration};
        currentTime=Number(time.currentTime)||0;duration=Number(time.duration)||0;report({ready:true});
      }else if(data.type==='onPlayerError'||data.type==='onError'){
        report({ready:true,error:typeof value==='object'?value.errorCode||value.errorType:value});
      }
    });
    const src=new URL('/player/v1/'+encodeURIComponent(videoId),'https://www.tiktok.com');
    for(const [key,value] of Object.entries({autoplay:1,controls:0,progress_bar:0,play_button:0,volume_control:0,fullscreen_button:0,timestamp:0,loop:0,music_info:0,description:0,rel:1,native_context_menu:0,closed_caption:0,muted:0}))src.searchParams.set(key,String(value));
    frame.src=src.toString();
    host.replaceChildren(frame);
    return;
  }
  if(!videoId&&!playlistId){document.body.textContent='Thiếu mã video hoặc playlist.';return;}
  let player=null,ready=false,locked=false,seq=0,lastKey='',timer=0;
  const sid=Math.random().toString(36).slice(2);
  const queued=[];
  function sendState(extra={}){
    if(!player||!ready)return;
    let currentTime=0,duration=0,state=-1;
    try{
      currentTime=player.getCurrentTime()||0;
      duration=player.getDuration()||0;
      state=player.getPlayerState();
    }catch{}
    // chỉ gửi khi có thay đổi thật sự (tối đa ~4 lần/giây) để trang chính không phải xử lý thừa
    const key=locked+'|'+Math.floor(currentTime*4)+'|'+duration+'|'+state+'|'+JSON.stringify(extra);
    if(key===lastKey)return;
    lastKey=key;
    const message={type:'gon-player-state',sid,seq:++seq,locked,currentTime,duration,state,...extra};
    window.parent.postMessage(message,location.origin);
    try{window.parent.opener?.postMessage(message,location.origin);}catch{}
  }
  function applyCommand(func,args=[]){
    if(func==='setLocked'){
      locked=Boolean(args[0]);
      document.body.classList.toggle('locked',locked);
      sendState();
      return;
    }
    if(!ready){queued.push([func,args]);return;}
    if(func==='seekTo')player.seekTo(Number(args[0])||0,true);
    else if(func==='seekToPreview')player.seekTo(Number(args[0])||0,false);
    else if(func==='setVolume')player.setVolume(Math.max(0,Math.min(100,Number(args[0])||0)));
    else if(['playVideo','pauseVideo','stopVideo','nextVideo','previousVideo','mute','unMute'].includes(func)&&typeof player[func]==='function')player[func]();
    sendState();
  }
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.data?.type!=='gon-command')return;
    applyCommand(event.data.func,event.data.args||[]);
  });
  window.addEventListener('keydown',event=>{
    if(event.altKey&&event.key.toLowerCase()==='l'){event.preventDefault();applyCommand('setLocked',[!locked]);}
  });
  // Tạm dừng vòng lặp báo trạng thái khi cửa sổ bị ẩn để đỡ tốn CPU
  document.addEventListener('visibilitychange',()=>{
    if(!ready)return;
    clearInterval(timer);timer=0;
    if(!document.hidden){sendState();timer=setInterval(()=>sendState(),250);}
  });
  window.onYouTubeIframeAPIReady=function(){
    const playerVars={autoplay:1,controls:0,disablekb:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin,widget_referrer:location.href};
    for(const key of ['start','end','index'])if(params.has(key))playerVars[key]=Number(params.get(key))||0;
    if(playlistId){playerVars.listType='playlist';playerVars.list=playlistId;}
    const options={width:'100%',height:'100%',playerVars,events:{
      onReady(event){
        player=event.target;ready=true;
        player.setVolume(80);
        for(const [func,args] of queued.splice(0))applyCommand(func,args);
        player.playVideo();
        sendState({ready:true});
        timer=setInterval(()=>sendState(),250);
      },
      onStateChange(event){sendState({ready:true});},
      onAutoplayBlocked(){sendState({ready:true,autoplayBlocked:true});},
      onError(event){sendState({ready:true,error:event.data});}
    }};
    if(videoId)options.videoId=videoId;
    player=new YT.Player('youtube-player',options);
  };
  const script=document.createElement('script');
  script.src='https://www.youtube.com/iframe_api';
  script.async=true;
  document.head.appendChild(script);
})();
</script>
</body></html>
