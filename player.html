<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube — Gọn</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:13px Arial,sans-serif}
#player{position:absolute;inset:0;background:#000}
#youtube-frame{display:block;width:100%;height:100%;border:0}
.controls{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;align-items:center;gap:5px;padding:9px 8px 7px;background:linear-gradient(transparent,#000d 28%);opacity:0;transform:translateY(5px);transition:opacity .16s,transform .16s;pointer-events:none}
#player:hover .controls,#player:focus-within .controls{opacity:1;transform:none;pointer-events:auto}
button{width:29px;height:29px;flex:none;border:0;border-radius:7px;background:#ffffff1a;color:#fff;font-size:15px;cursor:pointer}
button:hover:not(:disabled){background:#ffffff35}button:disabled{opacity:.35;cursor:not-allowed}
#volume{width:78px;min-width:38px;accent-color:#fff;cursor:pointer}
.volume-label{font-size:13px;margin-left:1px}
.spacer{flex:1}
#lock{width:auto;padding:0 8px;font-size:11px;white-space:nowrap}
.locked .controls{display:none!important}
.locked #youtube-frame{pointer-events:none}
</style>
</head>
<body>
<div id="player">
  <iframe id="youtube-frame" title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="controls" id="controls" role="toolbar" aria-label="Điều khiển video">
    <button id="previous" type="button" aria-label="Video trước" title="Video trước">⏮</button>
    <button id="play-pause" type="button" aria-label="Tạm dừng" title="Tạm dừng">Ⅱ</button>
    <button id="next" type="button" aria-label="Video tiếp theo" title="Video tiếp theo">⏭</button>
    <span class="spacer"></span>
    <span class="volume-label" aria-hidden="true">🔊</span>
    <input id="volume" type="range" min="0" max="100" value="80" aria-label="Âm lượng">
    <button id="lock" type="button" aria-pressed="false" title="Khóa thao tác trong cửa sổ nổi">🔒</button>
  </div>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const id=params.get('v')||'';
  const list=params.get('list')||'';
  const playerFrame=document.querySelector('#youtube-frame');
  const playButton=document.querySelector('#play-pause');
  const lockButton=document.querySelector('#lock');
  const volume=document.querySelector('#volume');
  let playing=true,locked=false,muted=false;

  if(!id&&!list){document.body.textContent='Thiếu mã video hoặc playlist.';return;}
  const src=new URL(id?'https://www.youtube.com/embed/'+encodeURIComponent(id):'https://www.youtube.com/embed/videoseries');
  for(const key of ['start','end','si','list','index'])if(params.get(key))src.searchParams.set(key,params.get(key));
  src.searchParams.set('autoplay','1');
  src.searchParams.set('controls','0');
  src.searchParams.set('playsinline','1');
  src.searchParams.set('rel','0');
  src.searchParams.set('enablejsapi','1');
  src.searchParams.set('origin',location.origin);
  src.searchParams.set('widget_referrer',location.href);
  playerFrame.src=src.toString();
  document.querySelector('#next').disabled=!list;
  document.querySelector('#previous').disabled=!list;

  function sendYoutube(func,args=[]){
    playerFrame.contentWindow?.postMessage(JSON.stringify({event:'command',func,args}),'https://www.youtube.com');
  }
  function reportLock(){
    window.parent.postMessage({type:'gon-player-state',locked},location.origin);
  }
  function setLocked(value){
    locked=Boolean(value);
    document.body.classList.toggle('locked',locked);
    lockButton.setAttribute('aria-pressed',String(locked));
    lockButton.textContent=locked?'🔓':'🔒';
    lockButton.title=locked?'Đã khóa · dùng nút trong app để mở khóa':'Khóa thao tác trong cửa sổ nổi';
    reportLock();
  }

  playButton.addEventListener('click',()=>{
    playing=!playing;
    sendYoutube(playing?'playVideo':'pauseVideo');
    playButton.textContent=playing?'Ⅱ':'▶';
    playButton.setAttribute('aria-label',playing?'Tạm dừng':'Tiếp tục');
    playButton.title=playing?'Tạm dừng':'Tiếp tục';
  });
  document.querySelector('#previous').addEventListener('click',()=>sendYoutube('previousVideo'));
  document.querySelector('#next').addEventListener('click',()=>sendYoutube('nextVideo'));
  volume.addEventListener('input',()=>sendYoutube('setVolume',[Number(volume.value)]));
  volume.addEventListener('dblclick',()=>{
    muted=!muted;
    sendYoutube(muted?'mute':'unMute');
    document.querySelector('.volume-label').textContent=muted?'🔇':'🔊';
  });
  lockButton.addEventListener('click',()=>setLocked(!locked));
  window.addEventListener('keydown',event=>{
    if(event.altKey&&event.key.toLowerCase()==='l'){event.preventDefault();setLocked(!locked);}
  });
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.data?.type!=='gon-command')return;
    if(event.data.func==='setLocked'){setLocked(event.data.args?.[0]);return;}
    sendYoutube(event.data.func,event.data.args||[]);
  });
  reportLock();
})();
</script>
</body></html>
